<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fertilizer Library | Green Harvest</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">🌱 Green Harvest</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="../index.html">Home</a><a href="fertilizers.html">Fertilizers</a><a href="crops.html">Crops</a><a href="recommendation.html">Recommendation</a><a href="calculator.html">Calculator</a><a href="dashboard.html">My Farm</a></nav></div></header><section class="page-head"><div class="container"><span class="eyebrow">LIBRARY</span><h1>Natural Fertilizers</h1><p class="muted">Search and explore natural fertilizer information.</p></div></section><main class="section"><div class="container"><div class="toolbar"><input class="input" id="search" placeholder="Search fertilizer, crop or purpose..."></div><div id="fertilizerGrid" class="grid"></div></div></main><footer><div class="container footer"><strong>🌱 Green Harvest</strong><span>Educational farmer support</span></div></footer><script src="../js/app.js"></script><script src="../js/data.js"></script><script>const grid=document.getElementById("fertilizerGrid"),search=document.getElementById("search");function render(){const q=search.value.toLowerCase();const list=fertilizers.filter(f=>(f.name+" "+f.type+" "+f.purpose+" "+f.crops.join(" ")).toLowerCase().includes(q));grid.innerHTML=list.map(f=>'<article class="item-card"><span class="tag">'+f.type+'</span><h3>'+f.name+'</h3><p>'+f.description+'</p><p><strong>Purpose:</strong> '+f.purpose+'</p><p><strong>Benefits:</strong> '+f.benefit+'</p><p class="small"><strong>Crops:</strong> '+f.crops.join(", ")+'</p><button class="btn" onclick="saveItem(\'savedFertilizers\',{name:\''+f.name+'\'})">Save</button></article>').join("")||'<div class="empty">No fertilizers found.</div>'}search.addEventListener("input",render);render();</script></body></html>
