<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Farm | Green Harvest</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">🌱 Green Harvest</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="../index.html">Home</a><a href="fertilizers.html">Fertilizers</a><a href="crops.html">Crops</a><a href="recommendation.html">Recommendation</a><a href="calculator.html">Calculator</a><a href="dashboard.html">My Farm</a></nav></div></header><section class="page-head"><div class="container"><span class="eyebrow">LOCAL DASHBOARD</span><h1>My Farm</h1><p class="muted">Saved information is stored only in this browser.</p></div></section><main class="section"><div class="container"><div class="two-col"><div class="item-card"><h3>Saved Fertilizers</h3><div id="savedF"></div></div><div class="item-card"><h3>Saved Recommendations</h3><div id="savedR"></div></div></div><div class="form-card" style="margin-top:25px"><h3>Save a Farm Record</h3><div class="field"><label>Farm name</label><input id="farm" class="input" placeholder="My Farm"></div><div class="field"><label>Crop</label><input id="farmCrop" class="input" placeholder="Tomato"></div><div class="field"><label>Area (acres)</label><input id="farmArea" class="input" type="number" step="0.1"></div><button class="btn" id="saveFarm">Save Farm</button><div id="farmMsg"></div></div><div class="item-card" style="margin-top:25px"><h3>My Farm Records</h3><div id="farms"></div></div></div></main><footer><div class="container footer"><strong>🌱 Green Harvest</strong><span>Educational farmer support</span></div></footer><script src="../js/app.js"></script><script>function show(){const f=getItems("savedFertilizers"),r=getItems("recommendations"),farms=getItems("farms");document.getElementById("savedF").innerHTML=f.length?f.map(x=>'<p>🌿 '+escapeHtml(x.name)+'</p>').join(""):'<p class="muted">No saved fertilizers.</p>';document.getElementById("savedR").innerHTML=r.length?r.map(x=>'<p>🔎 '+escapeHtml(x.crop)+' — '+escapeHtml(x.soil)+'</p>').join(""):'<p class="muted">No saved recommendations.</p>';document.getElementById("farms").innerHTML=farms.length?farms.map((x,i)=>'<div class="result"><strong>'+escapeHtml(x.name)+'</strong><p>Crop: '+escapeHtml(x.crop)+' | Area: '+escapeHtml(x.area)+' acre(s)</p><button class="btn secondary" onclick="removeFarm('+i+')">Delete</button></div>').join(""):'<p class="empty">No farm records saved.</p>'}function removeFarm(i){const f=getItems("farms");f.splice(i,1);localStorage.setItem("farms",JSON.stringify(f));show()}document.getElementById("saveFarm").onclick=()=>{const name=document.getElementById("farm").value.trim(),crop=document.getElementById("farmCrop").value.trim(),area=document.getElementById("farmArea").value;if(!name||!crop||!area){document.getElementById("farmMsg").innerHTML='<p class="danger">Please fill all fields.</p>';return}saveItem("farms",{name,crop,area});document.getElementById("farmMsg").innerHTML='<p class="success">Farm record saved.</p>';show()};show();</script></body></html>
