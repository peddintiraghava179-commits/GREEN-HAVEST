<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recommendation | Green Harvest</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">🌱 Green Harvest</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="../index.html">Home</a><a href="fertilizers.html">Fertilizers</a><a href="crops.html">Crops</a><a href="recommendation.html">Recommendation</a><a href="calculator.html">Calculator</a><a href="dashboard.html">My Farm</a></nav></div></header><section class="page-head"><div class="container"><span class="eyebrow">FARMER TOOL</span><h1>Find Natural Fertilizer Options</h1><p class="muted">Use the local project dataset to find matching educational information.</p></div></section><main class="section"><div class="container"><div class="form-card"><div class="field"><label for="crop">Crop</label><select id="crop" class="select"></select></div><div class="field"><label for="soil">Soil type</label><select id="soil" class="select"><option>Loamy</option><option>Sandy loam</option><option>Clay</option><option>Red soil</option><option>Alluvial</option></select></div><div class="field"><label for="stage">Crop stage</label><select id="stage" class="select"><option>Seedling</option><option>Vegetative</option><option>Flowering</option><option>Fruiting</option></select></div><button class="btn" id="recommend">Get Recommendation</button><div id="result"></div></div></div></main><footer><div class="container footer"><strong>🌱 Green Harvest</strong><span>Educational farmer support</span></div></footer><script src="../js/app.js"></script><script src="../js/data.js"></script><script>const cropSelect=document.getElementById("crop");cropSelect.innerHTML=crops.map(c=>'<option>'+c.name+'</option>').join("");document.getElementById("recommend").onclick=()=>{const c=crops.find(x=>x.name===cropSelect.value),soil=document.getElementById("soil").value,stage=document.getElementById("stage").value;const soilMatch=c.soil.includes(soil);document.getElementById("result").innerHTML='<div class="result"><h3>Suggested options for '+c.name+'</h3><p><strong>Soil:</strong> '+soil+' | <strong>Stage:</strong> '+stage+'</p><p>'+ (soilMatch?'The selected soil matches the stored crop profile.':'The selected soil is not listed in this sample crop profile; consider soil testing and local guidance.')+'</p><ul>'+c.fertilizers.map(x=>'<li>'+x+'</li>').join("")+'</ul><button class="btn" onclick="saveItem(\'recommendations\',{crop:\''+c.name+'\',soil:\''+soil+'\',stage:\''+stage+'\',options:'+JSON.stringify(c.fertilizers).replace(/"/g,"&quot;")+'})">Save Recommendation</button></div>')};</script></body></html>
