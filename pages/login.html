<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Farmer Login | Green Harvest</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">🌱 Green Harvest</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="../index.html">Home</a><a href="fertilizers.html">Fertilizers</a><a href="crops.html">Crops</a><a href="recommendation.html">Recommendation</a><a href="dashboard.html">My Farm</a></nav></div></header><section class="page-head"><div class="container"><span class="eyebrow">FARMER ACCOUNT</span><h1>Login / Register</h1><p class="muted">This demo uses browser LocalStorage. No password is sent to a server.</p></div></section><main class="section"><div class="container"><div class="form-card"><div class="field"><label>Name</label><input id="name" class="input" placeholder="Farmer name"></div><div class="field"><label>Mobile number</label><input id="mobile" class="input" inputmode="numeric" placeholder="10-digit mobile number"></div><button class="btn" id="login">Continue</button><div id="msg"></div></div></div></main><footer><div class="container footer"><strong>🌱 Green Harvest</strong><span>Local demo account</span></div></footer><script src="../js/app.js"></script><script>const old=currentUser();if(old){document.getElementById("name").value=old.name||"";document.getElementById("mobile").value=old.mobile||""}document.getElementById("login").onclick=()=>{const name=document.getElementById("name").value.trim(),mobile=document.getElementById("mobile").value.trim();if(name.length<2||!/^[0-9]{10}$/.test(mobile)){document.getElementById("msg").innerHTML='<p class="danger">Enter a valid name and 10-digit mobile number.</p>';return}localStorage.setItem("greenHarvestUser",JSON.stringify({name,mobile}));document.getElementById("msg").innerHTML='<p class="success">Welcome, '+escapeHtml(name)+'! Your local account is ready.</p><p><a class="btn" href="dashboard.html">Open My Farm</a></p>'};</script></body></html>
