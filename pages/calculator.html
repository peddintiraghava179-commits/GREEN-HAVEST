<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculator | Green Harvest</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">🌱 Green Harvest</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="../index.html">Home</a><a href="fertilizers.html">Fertilizers</a><a href="crops.html">Crops</a><a href="recommendation.html">Recommendation</a><a href="calculator.html">Calculator</a><a href="dashboard.html">My Farm</a></nav></div></header><section class="page-head"><div class="container"><span class="eyebrow">FARMER TOOL</span><h1>Application Range Calculator</h1><p class="muted">Uses a sample educational rate stored in this website. It is not a universal prescription.</p></div></section><main class="section"><div class="container"><div class="form-card"><div class="field"><label>Farm area (acres)</label><input class="input" id="area" type="number" min="0" step="0.1" placeholder="Example: 2"></div><div class="field"><label>Fertilizer</label><select class="select" id="fertilizer"><option value="100">Compost</option><option value="80">Vermicompost</option><option value="50">Neem Cake</option><option value="100">Farmyard Manure</option></select></div><button class="btn" id="calc">Calculate</button><div id="result"></div></div></div></main><footer><div class="container footer"><strong>🌱 Green Harvest</strong><span>Educational farmer support</span></div></footer><script src="../js/app.js"></script><script>document.getElementById("calc").onclick=()=>{const area=Number(document.getElementById("area").value),rate=Number(document.getElementById("fertilizer").value),name=document.getElementById("fertilizer").selectedOptions[0].text;if(!area||area<0){document.getElementById("result").innerHTML='<div class="result danger">Please enter a valid farm area.</div>';return}const total=area*rate;document.getElementById("result").innerHTML='<div class="result"><h3>Educational estimate</h3><p><strong>'+name+'</strong></p><p>Farm area: '+area+' acre(s)</p><p>Sample rate used: '+rate+' kg/acre</p><p><strong>Calculated amount: '+total.toFixed(1)+' kg</strong></p><p class="small">This sample calculation is for the website demonstration. Actual application should be based on soil testing, crop requirements and local agricultural guidance.</p></div>'};</script></body></html>
